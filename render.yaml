version: 3
services:
  - type: web
    name: expense-intelligence-api
    env: python
    region: oregon  # Change to your preferred region
    plan: free  # Upgrade to pro for better performance
    
    # Build
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:8000 --timeout 120 app.main:app
    
    # Root directory where the service lives
    rootDir: backend
    
    # Environment variables
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      
      # Critical: Set these in Render Dashboard (Settings -> Environment)
      # DATABASE_URL from Supabase connection string
      # SECRET_KEY set to a secure random value
      # CORS_ORIGIN set to your Vercel frontend URL
      # CORS_ORIGIN_REGEX for wildcard vercel.app domains
